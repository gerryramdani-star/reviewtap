    <style>
        /* Base Styling & Pattern Background */
        body {
            background-color: #FFDE59; /* Warna background kuning cerah khas retro/brutalist */
            /* Pola titik-titik (dot grid) untuk kesan zine/komik */
            background-image: radial-gradient(circle, #000 2px, transparent 2px);
            background-size: 32px 32px;
            color: #000;
            -webkit-font-smoothing: antialiased;
        }

        /* Container Card Utama */
        .neobrutal-container {
            background-color: #ffffff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0px 0px #000;
            border-radius: 16px;
        }

        /* Style Avatar / Logo */
        .neobrutal-avatar {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px 0px #000;
            transition: transform 0.2s ease;
        }
        
        .neobrutal-avatar:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        /* Tombol Neobrutalism dengan Kalkulasi Shadow Presisi */
        .neobrutal-btn {
            border: 4px solid #000;
            box-shadow: 6px 6px 0px 0px #000;
            border-radius: 12px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        /* Saat Hover: Tombol naik dan shadow membesar ke posisi absolut yang sama */
        .neobrutal-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px #000;
        }

        /* Saat Aktif (Diklik): Tombol turun menutupi bayangan sepenuhnya */
        .neobrutal-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        /* Efek Panah saat Hover */
        .neobrutal-btn:hover .arrow-icon {
            transform: translateX(4px);
        }
        .arrow-icon {
            transition: transform 0.2s ease;
        }
    </style>
